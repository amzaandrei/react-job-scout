[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "react-job-scout"
version = "0.1.0"
description = "ReAct-style autonomous agent for job-search reconnaissance. Demonstrates dynamic reasoning + acting interleaving."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.45.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "beautifulsoup4>=4.12.3",
    "pypdf>=4.3.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
job-scout = "react_job_scout.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
